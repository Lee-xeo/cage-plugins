<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Status</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>System Status</h1>
  <p id="note" class="note">Loading…</p>
  <section id="meters" hidden>
    <div class="meter"><div class="label"><span>Processor load</span><span id="load-text"></span></div><div class="bar"><i id="load-bar"></i></div></div>
    <div class="meter"><div class="label"><span>Memory</span><span id="memory-text"></span></div><div class="bar"><i id="memory-bar"></i></div></div>
    <div class="meter"><div class="label"><span>Disk</span><span id="disk-text"></span></div><div class="bar"><i id="disk-bar"></i></div></div>
    <p class="note" id="uptime"></p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
