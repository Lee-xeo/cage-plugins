<!doctype html>
<html lang="en" data-presentation="floating" data-scheme="light" data-density="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Status</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="hud" class="hud">
  <header class="page-head" id="page-head">
    <span class="pulse-dot" id="page-dot" aria-hidden="true"></span>
    <h1 id="page-title">System Status</h1>
  </header>

  <section id="state-panel" class="state-panel">
    <div class="state-skeleton" id="skeleton" aria-hidden="true">
      <div class="skel-hero"></div>
      <div class="skel-row"></div>
      <div class="skel-row"></div>
    </div>
    <p id="note" class="note">Connecting…</p>
  </section>

  <section id="content" class="content" hidden>
    <!-- Detailed telemetry layout -->
    <div id="full-view" class="full-view">
      <div class="card hero-card">
        <div class="hero-left">
          <div class="hero-kicker">
            <span class="pulse-dot" id="cpu-dot" aria-hidden="true"></span>
            <span id="label-cpu">CPU</span>
          </div>
          <div class="hero-value" id="cpu-pct">--%</div>
          <div class="hero-sub" id="cpu-sub">--</div>
        </div>
        <div class="spark-wrap" aria-hidden="true">
          <svg id="spark" class="spark" viewBox="0 0 132 52" preserveAspectRatio="none">
            <defs>
              <linearGradient id="spark-grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="currentColor" stop-opacity="0.30"/>
                <stop offset="100%" stop-color="currentColor" stop-opacity="0.01"/>
              </linearGradient>
            </defs>
            <line class="spark-mid" x1="0" y1="26" x2="132" y2="26"/>
            <path id="spark-area" class="spark-area" d=""/>
            <path id="spark-line" class="spark-line" d=""/>
            <circle id="spark-dot" class="spark-dot" cx="132" cy="52" r="2.8"/>
          </svg>
        </div>
      </div>

      <div class="card metrics-card">
        <div class="metric-row" id="row-mem">
          <div class="metric-head">
            <span class="metric-name">
              <svg class="metric-ico" viewBox="0 0 16 16" aria-hidden="true">
                <rect x="2.2" y="4.2" width="11.6" height="7.6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.35"/>
                <path d="M5 4.2V2.4M8 4.2V2.4M11 4.2V2.4M5 13.6v-1.8M8 13.6v-1.8M11 13.6v-1.8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
              </svg>
              <span id="label-mem">Memory</span>
            </span>
            <span class="metric-detail">
              <span class="metric-raw" id="mem-text">--</span>
              <span class="metric-pct" id="mem-pct">--%</span>
            </span>
          </div>
          <div class="bar"><i id="mem-bar"></i></div>
        </div>

        <div class="metric-sep" aria-hidden="true"></div>

        <div class="metric-row" id="row-disk">
          <div class="metric-head">
            <span class="metric-name">
              <svg class="metric-ico" viewBox="0 0 16 16" aria-hidden="true">
                <rect x="2.2" y="3" width="11.6" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.35"/>
                <path d="M2.5 9.5h11" stroke="currentColor" stroke-width="1.2"/>
                <circle cx="11.2" cy="11.2" r="0.85" fill="currentColor"/>
              </svg>
              <span id="label-disk">Disk</span>
            </span>
            <span class="metric-detail">
              <span class="metric-raw" id="disk-text">--</span>
              <span class="metric-pct" id="disk-pct">--%</span>
            </span>
          </div>
          <div class="bar"><i id="disk-bar"></i></div>
        </div>
      </div>

      <div class="load-strip">
        <span class="load-title" id="label-load">Load</span>
        <div class="load-pills">
          <span class="pill"><b>1m</b><em id="load-1m">-</em></span>
          <span class="pill"><b>5m</b><em id="load-5m">-</em></span>
          <span class="pill"><b>15m</b><em id="load-15m">-</em></span>
        </div>
        <span class="tasks-chip" id="tasks-chip" hidden></span>
      </div>
    </div>

    <!-- Ultra-compact ring HUD layout -->
    <div id="compact-view" class="compact-view" hidden>
      <div class="ring-tile" id="ring-cpu-tile">
        <div class="ring-box">
          <svg viewBox="0 0 44 44" aria-hidden="true">
            <circle class="ring-track" cx="22" cy="22" r="18"/>
            <circle class="ring-fill" id="ring-cpu" cx="22" cy="22" r="18"/>
          </svg>
          <span class="ring-val" id="ring-cpu-val">--</span>
        </div>
        <span class="ring-label" id="ring-cpu-label">CPU</span>
      </div>

      <div class="ring-tile" id="ring-mem-tile">
        <div class="ring-box">
          <svg viewBox="0 0 44 44" aria-hidden="true">
            <circle class="ring-track" cx="22" cy="22" r="18"/>
            <circle class="ring-fill" id="ring-mem" cx="22" cy="22" r="18"/>
          </svg>
          <span class="ring-val" id="ring-mem-val">--</span>
        </div>
        <span class="ring-label" id="ring-mem-label">MEM</span>
      </div>

      <div class="ring-tile" id="ring-disk-tile">
        <div class="ring-box">
          <svg viewBox="0 0 44 44" aria-hidden="true">
            <circle class="ring-track" cx="22" cy="22" r="18"/>
            <circle class="ring-fill" id="ring-disk" cx="22" cy="22" r="18"/>
          </svg>
          <span class="ring-val" id="ring-disk-val">--</span>
        </div>
        <span class="ring-label" id="ring-disk-label">DISK</span>
      </div>
    </div>

    <!-- Shared telemetry footer -->
    <footer class="hud-foot">
      <div class="foot-meta">
        <span class="net-chip" id="net-chip" hidden>
          <span id="net-rx">↓0</span>
          <span class="meta-dot" aria-hidden="true">·</span>
          <span id="net-tx">↑0</span>
        </span>
        <span class="uptime-chip" id="uptime">--</span>
      </div>
      <div class="foot-actions">
        <button type="button" class="icon-btn" id="density-btn" title="Compact view" aria-label="Compact view">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2.2" y="2.8" width="11.6" height="4.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.35"/>
            <rect x="2.2" y="9" width="11.6" height="4.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.35" opacity="0.45"/>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="refresh-btn" title="Refresh" aria-label="Refresh">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13 8a5 5 0 1 1-1.35-3.42M13 3.2v2.4h-2.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </footer>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
