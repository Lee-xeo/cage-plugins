<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="top">
    <h1 id="title">Film Studio</h1>
    <button type="button" id="refresh" class="ghost"></button>
  </header>
  <p id="project" class="small" hidden></p>

  <!-- Approval / connection problem card (filled by app.js) -->
  <section id="problem" class="card warn" hidden></section>
  <p id="loading" class="note"></p>

  <!-- Node.js problem -->
  <section id="node" class="card warn" hidden></section>

  <!-- 1. Status chips -->
  <section id="status" class="chips" aria-live="polite" hidden></section>

  <!-- Banner for the film Claude opened most recently -->
  <section id="banner" class="banner" hidden></section>

  <!-- 2. Setup card -->
  <section id="setup" class="card" hidden></section>

  <!-- 3. Films -->
  <section id="films-section" class="card" hidden>
    <h2 id="films-title"></h2>
    <form id="new-film" class="new-film" autocomplete="off">
      <label><span id="new-name-label"></span><input id="new-name" type="text" required></label>
      <button type="submit" id="new-submit" class="primary"></button>
    </form>
    <p id="new-target" class="small"></p>
    <p id="films-empty" class="note" hidden></p>
    <ul id="films" class="films"></ul>
  </section>

  <!-- 4. Jobs -->
  <section id="jobs-section" class="card" hidden>
    <h2 id="jobs-title"></h2>
    <p id="jobs-empty" class="note" hidden></p>
    <ul id="jobs" class="jobs"></ul>
  </section>

  <!-- 5. Settings (collapsed by default) -->
  <section id="settings-section" class="card" hidden>
    <details id="settings">
      <summary id="settings-title"></summary>
      <div id="settings-body" class="settings-body"></div>
    </details>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
