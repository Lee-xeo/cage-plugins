name: update-stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packages-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aggregate download counts and publish stats.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="packages"
          if ! gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release '${TAG}' does not exist yet; skipping stats update."
            exit 0
          fi
          python3 scripts/stats.py --repo "${GITHUB_REPOSITORY}" --tag "$TAG" --output /tmp/stats.json
          python3 scripts/stats.py --check --output /tmp/stats.json
          gh release upload "$TAG" /tmp/stats.json --repo "${GITHUB_REPOSITORY}" --clobber
